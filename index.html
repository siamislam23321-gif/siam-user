<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Firebase User System</title>
</head>
<body>

<h2>Signup</h2>
<input id="name" placeholder="নাম"><br><br>
<input id="sEmail" type="email" placeholder="Email"><br><br>
<input id="sPassword" type="password" placeholder="Password"><br><br>
<button onclick="signup()">Signup</button>

<hr>

<h2>Login</h2>
<input id="lEmail" type="email" placeholder="Email"><br><br>
<input id="lPassword" type="password" placeholder="Password"><br><br>
<button onclick="login()">Login</button>

<hr>

<h3>Forget Password</h3>
<input id="fEmail" type="email" placeholder="Email"><br><br>
<button onclick="resetPassword()">Reset Password</button>

<p id="msg"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getAuth, 
  createUserWithEmailAndPassword, 
  signInWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { getFirestore, doc, setDoc }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔹 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDI5zlA8EgHyQ5GJUkraLUSYQ_R9BKJlao",
  authDomain: "siam-user.firebaseapp.com",
  projectId: "siam-user"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔹 Signup Function
window.signup = async () => {
  try {
    const userName = document.getElementById("name").value.trim();
    const email = document.getElementById("sEmail").value.trim();
    const password = document.getElementById("sPassword").value;

    if(!userName || !email || !password){
      alert("সব ফিল্ড পূরণ করুন!");
      return;
    }

    const userCred = await createUserWithEmailAndPassword(auth, email, password);

    await setDoc(doc(db, "users", userCred.user.uid), {
      name: userName,
      email: email,
      role: "user",
      createdAt: new Date()
    });

    document.getElementById("msg").innerText = "Signup সফল হয়েছে ✅";
  } catch (e) {
    document.getElementById("msg").innerText = e.message;
  }
};

// 🔹 Login Function
window.login = async () => {
  try {
    const email = document.getElementById("lEmail").value.trim();
    const password = document.getElementById("lPassword").value;

    if(!email || !password){
      alert("Email ও Password লিখুন!");
      return;
    }

    await signInWithEmailAndPassword(auth, email, password);
    document.getElementById("msg").innerText = "Login সফল 🎉";
  } catch (e) {
    document.getElementById("msg").innerText = e.message;
  }
};

// 🔹 Forget Password Function
window.resetPassword = async () => {
  try {
    const email = document.getElementById("fEmail").value.trim();
    if(!email){
      alert("Email লিখুন!");
      return;
    }

    await sendPasswordResetEmail(auth, email);
    document.getElementById("msg").innerText = "📧 ইমেইলে পাসওয়ার্ড রিসেট লিংক পাঠানো হয়েছে";
  } catch (e) {
    document.getElementById("msg").innerText = e.message;
  }
};
</script>

</body>
</html>
