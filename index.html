<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>User System</title>
</head>
<body>

<h2>Signup</h2>
<input id="name" placeholder="নাম"><br><br>
<input id="sEmail" type="email" placeholder="Email"><br><br>
<input id="sPassword" type="password" placeholder="Password"><br><br>
<button onclick="signup()">Signup</button>

<hr>

<h2>Login</h2>
<input id="lEmail" type="email" placeholder="Email"><br><br>
<input id="lPassword" type="password" placeholder="Password"><br><br>
<button onclick="login()">Login</button>

<hr>

<h3>Forget Password</h3>
<input id="fEmail" type="email" placeholder="Email"><br><br>
<button onclick="resetPassword()">Reset Password</button>

<p id="msg"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getAuth, 
  createUserWithEmailAndPassword, 
  signInWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { getFirestore, doc, setDoc }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDI5zlA8EgHyQ5GJUkraLUSYQ_R9BKJlao",
  authDomain: "siam-user.firebaseapp.com",
  projectId: "siam-user"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔹 Signup + Database save
window.signup = async () => {
  try {
    const userCred = await createUserWithEmailAndPassword(
      auth, sEmail.value, sPassword.value
    );

    await setDoc(doc(db, "users", userCred.user.uid), {
      name: name.value,
      email: sEmail.value,
      role: "user",
      createdAt: new Date()
    });

    msg.innerText = "Signup সফল হয়েছে ✅";
  } catch (e) {
    msg.innerText = e.message;
  }
};

// 🔹 Login
window.login = async () => {
  try {
    await signInWithEmailAndPassword(
      auth, lEmail.value, lPassword.value
    );
    msg.innerText = "Login সফল 🎉";
  } catch (e) {
    msg.innerText = e.message;
  }
};

// 🔹 Forget Password
window.resetPassword = async () => {
  try {
    await sendPasswordResetEmail(auth, fEmail.value);
    msg.innerText = "📧 ইমেইলে পাসওয়ার্ড রিসেট লিংক পাঠানো হয়েছে";
  } catch (e) {
    msg.innerText = e.message;
  }
};
</script>

</body>
</html>
